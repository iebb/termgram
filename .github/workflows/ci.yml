name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            package: termgram-linux.tar.gz
          - platform: macos
            os: macos-latest
            package: termgram-macos.tar.gz
          - platform: windows
            os: windows-latest
            package: termgram-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform }}
      - run: cargo test --locked --all-targets --all-features
      - name: Build release binary
        run: cargo build --locked --release
        env:
          # Pull-request builds deliberately receive empty fallbacks. GitHub
          # does not expose repository secrets to untrusted fork workflows.
          TERMGRAM_EMBEDDED_API_ID: ${{ github.event_name == 'push' && secrets.TELEGRAM_API_ID || '' }}
          TERMGRAM_EMBEDDED_API_HASH: ${{ github.event_name == 'push' && secrets.TELEGRAM_API_HASH || '' }}
      - name: Package binary
        if: runner.os != 'Windows'
        run: tar -C target/release -czf "${{ matrix.package }}" tg
      - name: Package binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/tg.exe -DestinationPath "${{ matrix.package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tg-${{ matrix.platform }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14
