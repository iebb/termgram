name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Plan commit versions
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.version.outputs.plan }}
      has_releases: ${{ steps.version.outputs.has_releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derive versions from mainline commit heights
        id: version
        shell: bash
        env:
          AFTER_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"

          : > release-plan.tsv
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name' > published-tags.txt
            height=0
            while IFS= read -r sha; do
              height=$((height + 1))
              # Automatic publishing began at height 2. Older source did not
              # yet contain the build-version entry point.
              if ((height < 2)); then
                continue
              fi
              tag="v0.1.$height"
              if grep -Fxq "$tag" published-tags.txt; then
                test "$(git rev-list -n 1 "$tag")" = "$sha"
              else
                printf '%s\t%s\t0.1.%s\n' "$sha" "$height" "$height" \
                  >> release-plan.tsv
              fi
            done < <(git rev-list --first-parent --reverse "$AFTER_SHA")
          else
            height="$(git rev-list --first-parent --count "$AFTER_SHA")"
            printf '%s\t%s\t0.1.%s\n' "$AFTER_SHA" "$height" "$height" \
              >> release-plan.tsv
          fi
          plan="$(jq -Rsc '
            split("\n")
            | map(select(length > 0) | split("\t")
                | {sha: .[0], height: .[1], version: .[2]})
          ' release-plan.tsv)"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          if [[ "$plan" == '[]' ]]; then
            echo "has_releases=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_releases=true" >> "$GITHUB_OUTPUT"
          fi
          cat release-plan.tsv

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan
          path: release-plan.tsv
          if-no-files-found: error
          retention-days: 14

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check installer scripts
        shell: bash
        run: bash -n scripts/install.sh
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1).Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  build:
    name: Build (${{ matrix.platform }})
    needs:
      - version
      - check
    if: needs.version.outputs.has_releases == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            extension: tar.gz
          - platform: macos
            os: macos-latest
            extension: tar.gz
          - platform: windows
            os: windows-latest
            extension: zip
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_PLAN: ${{ needs.version.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.platform }}
      - name: Verify release credentials
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          [[ "$TELEGRAM_API_ID" =~ ^[0-9]+$ ]]
          [[ "$TELEGRAM_API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]
      - name: Build and package every pushed commit
        shell: bash
        env:
          TERMGRAM_EMBEDDED_API_ID: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && secrets.TELEGRAM_API_ID || '' }}
          TERMGRAM_EMBEDDED_API_HASH: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && secrets.TELEGRAM_API_HASH || '' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS=$'\t' read -r sha version; do
            sha="${sha%$'\r'}"
            version="${version%$'\r'}"
            git checkout --detach "$sha"
            export TERMGRAM_BUILD_VERSION="$version"
            cargo test --locked --all-targets --all-features
            cargo build --locked --release
            binary="target/release/tg"
            if [[ "$RUNNER_OS" == Windows ]]; then
              binary+=".exe"
            fi
            test "$("$binary" --version)" = "tg $version"

            if [[ "$RUNNER_OS" == Windows ]]; then
              (
                cd target/release
                7z a -tzip \
                  "../../dist/termgram-$version-${{ matrix.platform }}.zip" tg.exe
              )
            else
              tar -C target/release -czf \
                "dist/termgram-$version-${{ matrix.platform }}.tar.gz" tg
            fi
          done < <(jq -r '.[] | [.sha, .version] | @tsv' <<<"$RELEASE_PLAN")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tg-${{ matrix.platform }}
          path: dist/termgram-*-${{ matrix.platform }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
