name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - master

permissions:
  actions: read
  contents: read

concurrency:
  # A later run contains every still-unpublished first-parent commit, so one
  # global publisher avoids cross-run tag and asset races without skipping a
  # commit when GitHub replaces an older pending run.
  group: termgram-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested commits
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release plan from successful CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: release-plan
          path: metadata

      - name: Inspect release plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          test -f metadata/release-plan.tsv
          test ! -L metadata/release-plan.tsv
          if [[ -s metadata/release-plan.tsv ]]; then
            echo "has_releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_releases=false" >> "$GITHUB_OUTPUT"
            echo "The successful CI run has no unpublished commits."
          fi

      - name: Download binaries from successful CI run
        if: steps.plan.outputs.has_releases == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: tg-*
          merge-multiple: true
          path: dist

      - name: Validate release plan and prepare checksums
        if: steps.plan.outputs.has_releases == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/$DEFAULT_BRANCH"
          previous=
          final=
          declare -A seen_sha=()
          declare -A seen_version=()
          : > expected-assets.txt
          while IFS=$'\t' read -r sha height version extra; do
            [[ -z "${extra:-}" ]]
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$height" =~ ^[1-9][0-9]*$ ]]
            [[ "$version" == "0.1.$height" ]]
            [[ -z "${seen_sha[$sha]:-}" ]]
            [[ -z "${seen_version[$version]:-}" ]]
            test "$(git rev-list --first-parent --count "$sha")" = "$height"
            git merge-base --is-ancestor "$sha" "$SOURCE_SHA"
            if [[ -n "$previous" ]]; then
              test "$(git rev-parse "$sha^1")" = "$previous"
            fi
            seen_sha[$sha]=1
            seen_version[$version]=1
            previous="$sha"
            final="$sha"
            {
              printf 'termgram-%s-linux.tar.gz\n' "$version"
              printf 'termgram-%s-macos.tar.gz\n' "$version"
              printf 'termgram-%s-windows.zip\n' "$version"
            } >> expected-assets.txt
          done < metadata/release-plan.tsv
          test -n "$final"
          test "$final" = "$SOURCE_SHA"

          actual="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          wanted="$(sort expected-assets.txt)"
          test "$actual" = "$wanted"

          while IFS=$'\t' read -r sha height version; do
            asset_dir="prepared/$version"
            mkdir -p "$asset_dir"
            cp "dist/termgram-$version-linux.tar.gz" "$asset_dir/"
            cp "dist/termgram-$version-macos.tar.gz" "$asset_dir/"
            cp "dist/termgram-$version-windows.zip" "$asset_dir/"
            test "$(git cat-file -t "$sha:scripts/install.sh")" = blob
            test "$(git cat-file -t "$sha:scripts/install.ps1")" = blob
            git show "$sha:scripts/install.sh" > "$asset_dir/install.sh"
            git show "$sha:scripts/install.ps1" > "$asset_dir/install.ps1"
            chmod 0755 "$asset_dir/install.sh"
            (
              cd "$asset_dir"
              sha256sum \
                "termgram-$version-linux.tar.gz" \
                "termgram-$version-macos.tar.gz" \
                "termgram-$version-windows.zip" \
                install.sh install.ps1 > SHA256SUMS
            )
          done < metadata/release-plan.tsv

      - name: Publish GitHub releases idempotently
        if: steps.plan.outputs.has_releases == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TERMGRAM_RELEASE_SSH_KEY: ${{ secrets.TERMGRAM_RELEASE_SSH_KEY }}
        run: |
          set -euo pipefail

          key_path=
          known_hosts=
          cleanup() {
            [[ -z "$key_path" ]] || rm -f -- "$key_path"
            [[ -z "$known_hosts" ]] || rm -f -- "$known_hosts"
          }
          trap cleanup EXIT

          setup_release_ssh() {
            [[ -n "$TERMGRAM_RELEASE_SSH_KEY" ]]
            umask 077
            key_path="$(mktemp)"
            known_hosts="$(mktemp)"
            printf '%s\n' "$TERMGRAM_RELEASE_SSH_KEY" > "$key_path"
            gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          }

          while IFS=$'\t' read -r source_sha _height version; do
            tag="v$version"
            subject="$(git show -s --format=%s "$source_sha")"
            prerelease=true
            title="Termgram $version (prerelease)"
            latest=false
            if [[ "$subject" == release:* ]]; then
              prerelease=false
              title="Termgram $version"
              latest=legacy
            fi
            asset_dir="prepared/$version"

            if tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null)"; then
              if [[ "$tag_sha" != "$source_sha" ]]; then
                echo "Refusing to move conflicting tag $tag from $tag_sha to $source_sha" >&2
                exit 1
              fi
            else
              [[ -n "$key_path" ]] || setup_release_ssh
              git tag "$tag" "$source_sha"
              GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts" \
                git push "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/$tag"
              test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$source_sha"
            fi

            if release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json assets,databaseId,isDraft,isPrerelease,url 2>/dev/null)"; then
              is_draft="$(jq -r .isDraft <<<"$release_json")"
              if [[ "$is_draft" == false ]]; then
                existing_prerelease="$(jq -r .isPrerelease <<<"$release_json")"
                if [[ "$existing_prerelease" != "$prerelease" ]]; then
                  echo "Existing $tag release has the wrong release type" >&2
                  exit 1
                fi
                verify_dir="$(mktemp -d)"
                gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
                expected_names="$(printf '%s\n' \
                  SHA256SUMS install.sh install.ps1 \
                  "termgram-$version-linux.tar.gz" \
                  "termgram-$version-macos.tar.gz" \
                  "termgram-$version-windows.zip" | sort)"
                downloaded_names="$(find "$verify_dir" -maxdepth 1 -type f -printf '%f\n' | sort)"
                test "$downloaded_names" = "$expected_names"
                (
                  cd "$verify_dir"
                  test "$(wc -l < SHA256SUMS)" = 5
                  manifest_names="$(awk '{ name=$2; sub(/^\\*/, "", name); print name }' \
                    SHA256SUMS | sort)"
                  expected_manifest_names="$(printf '%s\n' \
                    install.sh install.ps1 \
                    "termgram-$version-linux.tar.gz" \
                    "termgram-$version-macos.tar.gz" \
                    "termgram-$version-windows.zip" | sort)"
                  test "$manifest_names" = "$expected_manifest_names"
                  sha256sum --strict --check SHA256SUMS
                )
                downloaded_assets="$(
                  find "$verify_dir" -maxdepth 1 -type f -exec sh -c '
                    for file do
                      digest="$(sha256sum "$file")"
                      printf "sha256:%s\t%s\n" \
                        "${digest%% *}" "$(basename "$file")"
                    done
                  ' sh {} + | sort
                )"
                remote_assets="$(jq -r '.assets[] | [.digest, .name] | @tsv' \
                  <<<"$release_json" | sort)"
                if [[ "$remote_assets" != "$downloaded_assets" ]]; then
                  echo "Existing $tag release API digests do not match downloaded bytes" >&2
                  exit 1
                fi
                rm -rf -- "$verify_dir"
                echo "Verified existing release $(jq -r .url <<<"$release_json")"
                continue
              fi
              release_id="$(jq -r .databaseId <<<"$release_json")"
            else
              create_args=(--repo "$GITHUB_REPOSITORY" --draft --title "$title" --generate-notes)
              create_args+=(--verify-tag)
              gh release create "$tag" "${create_args[@]}"
              release_id="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json databaseId --jq .databaseId)"
            fi

            gh release upload "$tag" "$asset_dir"/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false -F prerelease="$prerelease" \
              -f make_latest="$latest" -f name="$title" >/dev/null
          done < metadata/release-plan.tsv
