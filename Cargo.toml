[package]
name = "termgram"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A focused, keyboard-first Telegram client for the terminal"
license = "MIT"
repository = "https://github.com/iebb/termgram"

[[bin]]
name = "tg"
path = "src/main.rs"

[dependencies]
anstream = "=1.0.0"
anstyle = "=1.0.14"
anyhow = "1.0"
base64 = "=0.22.1"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
directories = "6.0"
dotenvy = "0.15"
getrandom = "=0.4.3"
futures-util = { version = "0.3.32", default-features = false }
grammers-client = { version = "=0.10.0", default-features = false, features = ["fs"] }
grammers-mtsender = { version = "=0.10.0", default-features = false, features = ["proxy"] }
grammers-session = { version = "=0.10.0", default-features = false, features = ["sqlite-storage"] }
image = { version = "=0.25.10", default-features = false }
moxcms = "=0.9.1"
notify-rust = "=4.18.0"
mlua = { version = "=0.12.1", features = ["lua55", "vendored", "serde", "error-send"] }
libsql = { version = "=0.9.30", default-features = false, features = ["core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "=1.13.1"
qrcode = { version = "=0.14.1", default-features = false }
ratatui-image = { version = "=11.1.0", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
sha2 = "=0.11.0"
tempfile = "=3.27.0"
tokio = { version = "1.52", default-features = false, features = ["macros", "rt", "signal", "sync", "time", "process", "io-util"] }
toml = "=1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "=0.2.2"
url = "=2.5.8"

yazi-config = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }
yazi-shared = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }
yazi-adapter = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }
yazi-emulator = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }
yazi-term = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }
yazi-tty = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
quick-xml = "=0.42.0"

[build-dependencies]
vergen-gitcl = "=10.0.3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[patch."https://github.com/sxyazi/yazi"]
yazi-term = { path = "vendor/yazi-term" }
yazi-tty = { path = "vendor/yazi-tty" }

[workspace]
members = ["."]
exclude = ["vendor/yazi-term", "vendor/yazi-tty", "vendor/grammers-session", "vendor/grammers-client", "vendor/grammers-mtsender", "vendor/libsql"]

[patch.crates-io]
grammers-session = { path = "vendor/grammers-session" }
grammers-client = { path = "vendor/grammers-client" }
grammers-mtsender = { path = "vendor/grammers-mtsender" }
libsql = { path = "vendor/libsql" }
