[package]
name = "termgram"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A focused, keyboard-first Telegram client for the terminal"
license = "MIT"
repository = "https://github.com/iebb/termgram"

[[bin]]
name = "tg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0"
dotenvy = "0.15"
futures-util = { version = "0.3.32", default-features = false }
grammers-client = { version = "=0.10.0", default-features = false, features = ["fs"] }
grammers-session = { version = "=0.10.0", default-features = false, features = ["sqlite-storage"] }
image = { version = "=0.25.10", default-features = false }
moxcms = "=0.9.1"
qrcode = { version = "=0.14.1", default-features = false }
ratatui-image = { version = "=11.1.0", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
sha2 = "=0.11.0"
tokio = { version = "1.52", default-features = false, features = ["macros", "rt", "signal", "sync", "time"] }
toml = "=1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "=0.2.2"

yazi-adapter = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }
yazi-emulator = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }
yazi-term = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }
yazi-tty = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[patch."https://github.com/sxyazi/yazi"]
yazi-term = { path = "vendor/yazi-term" }

[workspace]
members = ["."]
exclude = ["vendor/yazi-term"]
